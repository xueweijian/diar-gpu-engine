name: kaggle-p100

# Manual by default: P100 time is a scarce experimental budget.
on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Kaggle timeout
        required: false
        default: '1800'

permissions:
  contents: read

jobs:
  p100-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kaggle CLI
        run: python -m pip install --disable-pip-version-check kaggle
      - name: Push P100 smoke kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/kaggle-config"
          printf '%s' "$KAGGLE_API_TOKEN" > "$RUNNER_TEMP/kaggle-config/access_token"
          chmod 600 "$RUNNER_TEMP/kaggle-config/access_token"
          export KAGGLE_CONFIG_DIR="$RUNNER_TEMP/kaggle-config"
          kaggle kernels push -p kaggle/p100_smoke --accelerator NvidiaTeslaP100
