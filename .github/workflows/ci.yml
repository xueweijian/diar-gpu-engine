name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizer:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: source-hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check forbidden ASR dependencies in core
        shell: bash
        run: |
          if grep -RniE '#include.*(whisper|parakeet|nemotron|tokenizer)|find_package.*(whisper|parakeet|nemotron)|import[[:space:]]+(whisper|parakeet|nemotron|tokenizer)' include src tests CMakeLists.txt; then
            echo 'forbidden ASR dependency found in core'
            exit 1
          fi
      - name: Check model artifacts are absent
        run: |
          test -z "$(find . -type f \( -name '*.nemo' -o -name '*.ckpt' -o -name '*.gguf' -o -name '*.onnx' \) -print)"
