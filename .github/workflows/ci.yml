name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  cuda-build:
    name: nvcc-compile-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA toolkit (compile-only; no GPU on runners)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nvidia-cuda-toolkit
          nvcc --version
      - name: Compile gate (fatbin sm_60/70/75 + compute_60 PTX)
        run: |
          nvcc -O2 -std=c++17 -DDIAR_WITH_CUDA -Iinclude -gencode arch=compute_60,code=sm_60 -gencode arch=compute_70,code=sm_70 -gencode arch=compute_75,code=sm_75 -gencode arch=compute_60,code=compute_60 -x cu src/backend_cuda.cpp -x cu tools/step3_bench_main.cpp src/backend.cpp src/cublas_layout.cpp src/nn.cpp src/gguf.cpp -lcublas -o /tmp/step3_bench
          nvcc -O2 -std=c++17 -DDIAR_WITH_CUDA -Iinclude -gencode arch=compute_60,code=sm_60 -gencode arch=compute_70,code=sm_70 -gencode arch=compute_75,code=sm_75 -gencode arch=compute_60,code=compute_60 -x cu src/backend_cuda.cpp -x cu tools/step4_bench_main.cpp src/backend.cpp src/cublas_layout.cpp src/nn.cpp src/gguf.cpp src/mha.cpp src/conv.cpp src/conformer.cpp src/layers.cpp src/posenc.cpp src/subsampling.cpp -lcublas -o /tmp/step4_bench
          nvcc -O2 -std=c++17 -DDIAR_WITH_CUDA -Iinclude -gencode arch=compute_60,code=sm_60 -gencode arch=compute_70,code=sm_70 -gencode arch=compute_75,code=sm_75 -gencode arch=compute_60,code=compute_60 -x cu src/backend_cuda.cpp -x cu tools/step5_bench_main.cpp src/backend.cpp src/cublas_layout.cpp src/nn.cpp src/gguf.cpp src/mha.cpp src/conv.cpp src/conformer.cpp src/layers.cpp src/posenc.cpp src/subsampling.cpp -lcublas -o /tmp/step5_bench
 -x cu src/backend_cuda.cpp -x cu src/encoder_cuda.cpp -x cu tools/diar_bench_main.cpp src/backend.cpp src/cublas_layout.cpp src/nn.cpp src/gguf.cpp src/mha.cpp src/conv.cpp src/conformer.cpp src/layers.cpp src/posenc.cpp src/subsampling.cpp src/sortformer.cpp src/engine.cpp src/fe.cpp src/diar.cpp src/aosc.cpp src/birth_gate.cpp src/tailfix.cpp src/profile.cpp -DDIAR_PROFILE_STAGE -lcublas -o /tmp/diar_bench
      - name: Fatbin arch verification
        run: |
          cuobjdump --list-elf /tmp/step4_bench | tee /tmp/elf.txt
          cuobjdump --list-ptx /tmp/step4_bench | tee /tmp/ptx.txt
          cuobjdump --list-elf /tmp/diar_bench > /tmp/elf6.txt
          cuobjdump --list-ptx /tmp/diar_bench > /tmp/ptx6.txt
          for a in sm_60 sm_70 sm_75; do
            grep -q "$a" /tmp/elf6.txt || { echo "diar_bench MISSING SASS $a"; exit 1; }
          done
          grep -Eq "sm_60\.ptx|compute_60" /tmp/ptx6.txt || { echo "diar_bench MISSING PTX compute_60"; exit 1; }
          echo "diar_bench fatbin carries all 3 SASS + PTX: OK"
          for a in sm_60 sm_70 sm_75; do
            grep -q "$a" /tmp/elf.txt || { echo "MISSING SASS $a"; exit 1; }
          done
          grep -Eq "sm_60\.ptx|compute_60" /tmp/ptx.txt || { echo "MISSING PTX for compute_60"; exit 1; }
          echo "fatbin carries all 3 SASS + PTX: OK"
      - name: CPU selftest of the bench harness
        run: |
          g++ -std=c++17 -Wall -Wextra -Iinclude -O2             tools/step3_bench_main.cpp src/cublas_layout.cpp src/nn.cpp             src/gguf.cpp -o /tmp/step3_selftest
          /tmp/step3_selftest | tee /tmp/selftest.txt
          grep -q '"mode":"cpu-selftest-complete"' /tmp/selftest.txt
          g++ -std=c++17 -Wall -Wextra -Iinclude -O2             tools/step4_bench_main.cpp src/nn.cpp src/mha.cpp src/conv.cpp             src/conformer.cpp src/layers.cpp src/posenc.cpp             src/subsampling.cpp src/gguf.cpp -o /tmp/step4_selftest
          /tmp/step4_selftest | tee /tmp/selftest4.txt
          grep -q '"mode":"cpu-selftest-complete"' /tmp/selftest4.txt
          g++ -std=c++17 -Wall -Wextra -Iinclude -O2             tools/step5_bench_main.cpp src/nn.cpp src/mha.cpp src/conv.cpp             src/conformer.cpp src/layers.cpp src/posenc.cpp             src/subsampling.cpp src/gguf.cpp src/cublas_layout.cpp -o /tmp/step5_selftest
          /tmp/step5_selftest | tee /tmp/selftest5.txt
          grep -q '"mode":"cpu-selftest-complete"' /tmp/selftest5.txt
          g++ -std=c++17 -Wall -Wextra -Iinclude -O2 tools/diar_bench_main.cpp src/backend.cpp src/cublas_layout.cpp src/nn.cpp src/mha.cpp src/conv.cpp src/conformer.cpp src/layers.cpp src/posenc.cpp src/subsampling.cpp src/gguf.cpp src/sortformer.cpp src/engine.cpp src/fe.cpp src/diar.cpp src/aosc.cpp src/birth_gate.cpp src/tailfix.cpp src/profile.cpp -o /tmp/diar_bench_cpu
          /tmp/diar_bench_cpu --selftest | tee /tmp/diar_bench_selftest.txt
          grep -q "OK" /tmp/diar_bench_selftest.txt

  sanitizer:
    name: asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    name: source-hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check forbidden ASR dependencies in core
        shell: bash
        run: |
          if grep -RniE '#include.*(whisper|parakeet|nemotron|tokenizer)|find_package.*(whisper|parakeet|nemotron)|import[[:space:]]+(whisper|parakeet|nemotron|tokenizer)' include src tests CMakeLists.txt; then
            echo 'forbidden ASR dependency found in core'
            exit 1
          fi
      - name: Check model artifacts are absent
        run: |
          test -z "$(find . -type f \( -name '*.nemo' -o -name '*.ckpt' -o -name '*.gguf' -o -name '*.onnx' \) -print)"
